<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <title>扫雷 Minesweeper</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>扫雷</h1>
      <p class="subtitle">Minesweeper</p>
    </header>

    <div class="toolbar">
      <div class="diff-group" role="group" aria-label="难度">
        <button type="button" class="diff active" data-diff="beginner">初级</button>
        <button type="button" class="diff" data-diff="intermediate">中级</button>
        <button type="button" class="diff" data-diff="expert">高级</button>
      </div>
    </div>

    <div class="hud">
      <div class="counter" id="mine-count" title="剩余雷数">010</div>
      <button type="button" class="face" id="face" aria-label="重新开始" title="重新开始">🙂</button>
      <div class="counter" id="timer" title="用时">000</div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="雷区"></div>
    </div>

    <p class="hint">左键揭开 · 右键插旗 · 触屏长按插旗</p>
    <p class="status" id="status" aria-live="polite"></p>
  </div>
  <script src="./game.js"></script>
</body>
</html>
